name: WidgetDriver
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  # UI tests need a target app; the test drives SpringBoard and never launches this one.
  DriverHost:
    type: application
    platform: iOS
    sources: [DriverHost]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lab.widgetdriver.host
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  WidgetDriverUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WidgetDriverUITests]
    dependencies:
      - target: DriverHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lab.widgetdriver.uitests
schemes:
  WidgetDriver:
    build:
      targets:
        DriverHost: all
        WidgetDriverUITests: [test]
    test:
      targets: [WidgetDriverUITests]
